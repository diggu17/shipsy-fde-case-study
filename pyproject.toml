[project]
name = "dispatch-planner"
version = "0.1.0"
description = "Route planning with address intelligence for last-mile couriers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "ortools>=9.11",
    "pymongo>=4.10",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "playwright>=1.48",
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
